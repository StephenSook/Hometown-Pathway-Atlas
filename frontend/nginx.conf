# Hometown Pathway Atlas — frontend nginx config for Cloud Run.
#
# Single server block on port 8080 (Cloud Run default $PORT). Replaces
# the default /etc/nginx/conf.d/default.conf inside the nginx:alpine
# image (see Dockerfile).
#
# Key behaviors:
#   - SPA fallback: try_files routes deep links to index.html so
#     react-router-dom-style URLs don't 404.
#   - Cache strategy: hashed assets in /assets/ are cached for a year
#     (Vite emits content-hashed filenames so cache-busting is automatic);
#     index.html is no-cache so users always get the latest deploy.
#   - Compression: gzip text-like content; skip already-compressed assets.
#   - Default health-check: Cloud Run pings /, nginx serves index.html
#     with 200, container marked healthy.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # SPA fallback — every unmatched route serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache the hashed asset bundles (Vite emits ./assets/*.[hash].{js,css})
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
  }

  # Never cache index.html — guarantees users see the latest deploy
  location = /index.html {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # Optional health endpoint — Cloud Run uses / by default but having
  # /healthz lets us add a separate liveness probe without serving the
  # SPA shell on every check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Disable directory listing (defense in depth — alpine nginx default
  # is already off, this just makes intent explicit).
  autoindex off;
}

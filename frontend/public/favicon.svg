<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Atlas favicon — parity glyph.
    Two equal-weight vertical bars (Olympic + Paralympic) inside a navy
    rounded square. Reads at 16x16 as "two parallel bars" → signals the
    locked parity discipline (Olympic + Paralympic side-by-side, never
    merged). Brand colors lift directly from tailwind.config:
      navy            #1F3A5F   (frame)
      olympic-blue    #5B7DB1   (left bar)
      paralympic-clay #B96B5C   (right bar)
      warm-neutral    #F5F1EB   (interior)
  -->
  <rect width="64" height="64" rx="12" fill="#1F3A5F" />
  <rect x="6" y="6" width="52" height="52" rx="8" fill="#F5F1EB" />
  <rect x="18" y="16" width="10" height="32" rx="2" fill="#5B7DB1" />
  <rect x="36" y="16" width="10" height="32" rx="2" fill="#B96B5C" />
</svg>
